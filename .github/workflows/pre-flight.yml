name: Pre-flight

run-name: "Validate Branch: ${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - chore/**
      - feature/**
      - fix/**
      - docs/**

concurrency:
  group: pre-flight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Validate Branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Unit Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke-test
        run: npm run smoke
